<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: 'Fira Code','JetBrains Mono',Consolas,monospace; font-size: 18px; white-space: pre; }
    .l { opacity: 0; animation: show .5s ease forwards; }
    .kw { fill: #4da33e; } .key { fill: #d7efd3; } .str { fill: #9be58d; }
    .pun { fill: #6f9a76; } .cm { fill: #5b7a62; font-style: italic; } .bool { fill: #f4d35e; }
    .ln { fill: #335540; font-size: 16px; }
    .cur { fill: #4da33e; animation: blink 1s steps(1) infinite; }
    .hl { opacity: 0; animation: show .5s ease 2.8s forwards; }
    @keyframes show { from { opacity:0; transform: translateX(-8px);} to { opacity:1; transform: translateX(0);} }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
