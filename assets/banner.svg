<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: 'Fira Code','JetBrains Mono',Consolas,monospace; }
    .up { opacity: 0; animation: up .8s ease forwards; }
    .fl1 { animation: float 5s ease-in-out infinite; }
    .fl2 { animation: float 6.5s ease-in-out infinite reverse; }
    .fl3 { animation: float 4.2s ease-in-out infinite; }
    .dot { animation: pulse 1.6s ease-in-out infinite; }
    .scan { animation: scan 4s linear infinite; }
    .glow { animation: glow 4s ease-in-out infinite; }
    @keyframes up { from { opacity:0; transform: translateY(14px);} to { opacity:1; transform: translateY(0);} }
    @keyframes float { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-14px);} }
    @keyframes pulse { 0%,100% { opacity:1;} 50% { opacity:.45;} }
    @keyframes scan { from { transform: translateX(-300px);} to { transform: translateX(1000px);} }
    @keyframes glow { 0%,100% { opacity:.75;} 50% { opacity:1;} }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4da33e" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <radialGradient id="g1" cx="78%" cy="45%" r="55%">
      <stop offset="0" stop-color="#4da33e" stop-opacity=".45"/>
      <stop offset="1" stop-color="#4da33e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0%" cy="100%" r="60%">
      <stop offset="0" stop-color="#104d2b" stop-opacity=".9"/>
      <stop offset="1" stop-color="#104d2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#a6e09b"/>
      <stop offset="1" stop-color="#4da33e"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4da33e"/>
      <stop offset=".5" stop-color="#104d2b"/>
      <stop offset="1" stop-color="#4da33e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4da33e" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9be58d"/>
      <stop offset="1" stop-color="#4da33e" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="clip"><rect x="2" y="2" width="996" height="316" rx="20"/></clipPath>
  </defs>

  <rect x="2" y="2" width="996" height="316" rx="20" fill="#06100a"/>
  <g clip-path="url(#clip)">
    <rect width="1000" height="320" fill="url(#grid)"/>
    <rect width="1000" height="320" fill="url(#g2)"/>
    <rect class="glow" width="1000" height="320" fill="url(#g1)"/>
    <rect class="scan" x="0" y="296" width="300" height="3" fill="url(#beam)"/>
  </g>
  <rect x="2" y="2" width="996" height="316" rx="20" fill="none" stroke="url(#border)" stroke-width="2"/>

  <!-- window dots -->
  <circle cx="38" cy="34" r="6" fill="#ff5f56"/>
  <circle cx="58" cy="34" r="6" fill="#ffbd2e"/>
  <circle cx="78" cy="34" r="6" fill="#27c93f"/>

  <!-- right side symbols -->
  <g class="fl1">
    <text x="690" y="205" font-size="130" font-weight="700" fill="#4da33e" filter="url(#blur)" opacity=".55">&lt;/&gt;</text>
    <text x="690" y="205" font-size="130" font-weight="700" fill="none" stroke="#7fc572" stroke-width="2">&lt;/&gt;</text>
  </g>
  <g class="fl2">
    <text x="880" y="110" font-size="56" font-weight="700" fill="#4da33e" opacity=".9">{ }</text>
  </g>
  <g class="fl3">
    <text x="640" y="95" font-size="34" font-weight="700" fill="#104d2b" stroke="#4da33e" stroke-width="1.2">;</text>
    <text x="900" y="270" font-size="40" font-weight="700" fill="none" stroke="#4da33e" stroke-width="1.5">[ ]</text>
    <text x="760" y="275" font-size="30" font-weight="700" fill="#7fc572" opacity=".7">( )</text>
  </g>

  <!-- left content -->
  <text class="up" x="60" y="92" font-size="18" fill="#5b7a62" style="animation-delay:.1s">// hello, world — i am</text>
  <text class="up" x="60" y="170" font-size="64" font-weight="700" fill="url(#name)" style="animation-delay:.4s">Badhruz Zaman</text>
  <text class="up" x="62" y="215" font-size="21" fill="#d7efd3" style="animation-delay:.8s">CSE Student  <tspan fill="#4da33e">•</tspan>  UI/UX Designer  <tspan fill="#4da33e">•</tspan>  Front-end Learner</text>

  <g class="up" style="animation-delay:1.2s">
    <rect x="60" y="244" width="270" height="38" rx="19" fill="#104d2b" fill-opacity=".6" stroke="#4da33e" stroke-width="1.5"/>
    <circle class="dot" cx="84" cy="263" r="10" fill="#4da33e" fill-opacity=".35"/>
    <circle class="dot" cx="84" cy="263" r="5.5" fill="#b6f5a8"/>
    <text x="102" y="269" font-size="16" fill="#e6f5e3">Open to internships</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
